[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ev_charging_data_unified_schema"
version = "0.1.0"
description = "Consolidates public EV-charging session data from four operators into one tested dbt schema on DuckDB."
requires-python = ">=3.12"
readme = "README.md"
# Runtime = ingestion + the dbt warehouse. No model, no server, no paid service.
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "duckdb>=1.0",
  "pydantic>=2.6",
  "requests>=2.32",
  "rapidfuzz>=3.9",
  "dbt-core>=1.9",
  "dbt-duckdb>=1.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "black>=24",
  "jsonschema>=4",
  "pyyaml>=6",
  "sqlfluff>=3.0",
  "sqlfluff-templater-dbt>=3.0",
]

[tool.setuptools.packages.find]
include = ["ev_charging_data_unified_schema*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "\\.venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
