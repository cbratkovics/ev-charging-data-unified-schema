[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ev_charging_data_unified_schema"
version = "0.1.0"
description = "Consolidates five messy partner feeds into one tested dbt schema on DuckDB."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "scipy>=1.12",
  "joblib>=1.3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "duckdb>=1.0",
]

[project.optional-dependencies]
train = [
  "pyarrow>=15",
  "jinja2>=3.1",
  "dbt-core>=1.9",
  "dbt-duckdb>=1.9",
]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.5",
  "black>=24",
  "jsonschema>=4",
  "pyyaml>=6",
  "sqlfluff>=3.0",
  "sqlfluff-templater-dbt>=3.0",
]

[tool.setuptools.packages.find]
include = ["ev_charging_data_unified_schema*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["frontend", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.black]
line-length = 100
target-version = ["py312"]
extend-exclude = "frontend|\\.venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
