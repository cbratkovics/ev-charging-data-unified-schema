# ev_charging_data_unified_schema_dbt — medallion warehouse over the landed session files.
# bronze: string-typed one-to-one copies of the landed parquet per source; silver: typed,
# conformed, deduplicated sessions with a quarantine; gold: contracted facts and dimensions.
# See docs/ARCHITECTURE.md.
name: ev_charging_data_unified_schema_dbt
version: "1.0.0"
config-version: 2
require-dbt-version: ">=1.9.0"

profile: ev_charging_data_unified_schema_dbt

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Mirrored from ev_charging_data_unified_schema/config.py; tests/test_project_config.py fails
  # when these defaults drift from config.dbt_vars(). Every path is relative to the repository
  # root; run dbt from there (Makefile, CI).
  # Directory of landed parquet, one sub-directory per source (the loaders write it; the
  # fixture under tests/fixtures/landed has the same layout for offline runs).
  landed_dir: "data/landed"
  # The session sources in scope, by short name.
  sources: [boulder, cary, dft_2017]
  # fct_charging_session is incremental: an incremental run reprocesses sessions whose
  # start falls within this many days of the newest start already loaded, so late or
  # re-delivered rows are picked up without a full refresh. Not calibrated until Phase 4.
  sessions_lookback_days: 45

models:
  ev_charging_data_unified_schema_dbt:
    +materialized: table
    bronze:
      +schema: bronze
      +tags: ["bronze"]
    silver:
      +schema: silver
      +tags: ["silver"]
    gold:
      +schema: gold
      +tags: ["gold"]
      +contract:
        enforced: true

tests:
  ev_charging_data_unified_schema_dbt:
    +store_failures: false
