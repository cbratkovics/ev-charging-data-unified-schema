# Committed on purpose: no secret lives here. There is one target, a local DuckDB file, used by
# local builds, CI and the full build alike ($0 runtime). The MotherDuck prod target the template
# shipped was removed (docs/adr/0001-origin.md).
ev_charging_data_unified_schema_dbt:
  target: dev
  outputs:
    dev:
      type: duckdb
      # <PREFIX>_DUCKDB_PATH lets tests build into a scratch file.
      path: "{{ env_var('EV_CHARGING_DATA_UNIFIED_SCHEMA_DUCKDB_PATH', '.duckdb/dev.duckdb') }}"
      schema: main
      threads: 4
      # DuckDB's own parallelism (dbt `threads` only bounds model concurrency). Parallel
      # aggregation order is not deterministic, so exports differ at the 1e-15 level between
      # builds; <PREFIX>_DUCKDB_THREADS=1 makes a build reproducible (docs/REPRODUCIBILITY.md).
      settings:
        threads: "{{ env_var('EV_CHARGING_DATA_UNIFIED_SCHEMA_DUCKDB_THREADS', '4') | int }}"
