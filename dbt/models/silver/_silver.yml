version: 2

# Silver = the data contracts. Every check the scheduled job HOLDs on is a dbt test here.
models:
  - name: slv_period_rows
    description: >
      Cleaned source rows at the (station_id, day, day) grain: cohorts in
      scope, deduplicated, rows of the period being scored dropped, with the rules-based target.
      Incremental (delete+insert) with a lookback of var rows_lookback_periods (model header).
    config:
      materialized: incremental
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ station_id, day, day ]
      - dbt_expectations.expect_table_columns_to_contain_set:
          arguments:
            column_list: [ station_id, station_name, channel, day, day, team, stat_a, stat_b, stat_c, utilization ]
      - row_count_within_pct_of_prior_period:
          arguments:
            period_columns: [ day, day ]
            tolerance_pct: "{{ var('row_count_tolerance_pct') }}"
    columns:
      - { name: station_id, description: entity identifier, data_tests: [not_null] }
      - name: day
        description: season (>= var min_season)
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: "{{ var('min_season') }}"
      - name: day
        description: period 1..periods_per_season
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 1
                max_value: "{{ var('periods_per_season') }}"
      - { name: period_key, description: season * period_key_base + period; monotonic in time }
      - name: channel
        description: cohort in scope
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ A,B ]
      - { name: team, description: team / group attribute }
      - { name: station_name, description: display name }
      - { name: stat_a, description: raw stat a (never negative), data_tests: [{ dbt_expectations.expect_column_values_to_be_between: { arguments: { min_value: 0 } } }] }
      - { name: stat_b, description: raw stat b (never negative), data_tests: [{ dbt_expectations.expect_column_values_to_be_between: { arguments: { min_value: 0 } } }] }
      - { name: stat_c, description: raw stat c (never negative), data_tests: [{ dbt_expectations.expect_column_values_to_be_between: { arguments: { min_value: 0 } } }] }
      - { name: utilization, description: the source's published target, data_tests: [not_null] }
      - { name: target_rules_value, description: the target recomputed by the rules macro (must reconcile), data_tests: [not_null] }

  - name: slv_predictions
    description: Every recorded prediction at the grain × model_version × candidate, unioned from the three artifact families with the documented dedup rule and evaluation window.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ station_id, day, day, model_version, candidate]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "prediction_floor <= prediction and prediction <= prediction_ceiling"
    columns:
      - { name: station_id, description: entity identifier, data_tests: [not_null] }
      - { name: day, description: season, data_tests: [not_null] }
      - { name: day, description: period, data_tests: [not_null] }
      - { name: period_key, description: season * period_key_base + period }
      - { name: model_version, description: model version, data_tests: [not_null] }
      - { name: candidate, description: candidate, data_tests: [not_null, { accepted_values: { arguments: { values: [rf, gbm] } } }] }
      - { name: channel, description: cohort, data_tests: [not_null, { accepted_values: { arguments: { values: [ A,B ] } } }] }
      - { name: station_name, description: display name as recorded }
      - { name: team, description: team as recorded }
      - { name: prediction, description: point prediction, data_tests: [not_null] }
      - { name: prediction_floor, description: floor }
      - { name: prediction_ceiling, description: ceiling }
      - { name: actual_recorded, description: realised target as recorded in the artifact }
      - { name: source, description: artifact family, data_tests: [{ accepted_values: { arguments: { values: [frozen_test, out_of_sample_season, periodic] } } }] }
      - { name: source_file, description: repo-relative path of the surviving row }
      - { name: generated_at_utc, description: when written (periodic files only) }
      - { name: eval_window, description: evaluation window label, data_tests: [not_null] }
      - { name: window_start_key, description: period_key of the window's first period }

  - name: slv_eval_metrics
    description: Published evaluation numbers per (eval_id, cohort), verbatim from the artifacts.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [eval_id, cohort]
    columns:
      - { name: eval_id, description: evaluation id }
      - { name: kind, description: evaluation kind }
      - { name: season, description: evaluated season }
      - { name: model_version, description: model version }
      - { name: feature_version, description: feature version }
      - { name: code_commit, description: commit }
      - { name: generated_at_utc, description: when written }
      - { name: input_path, description: scored input path }
      - { name: input_sha256, description: input hash }
      - { name: baseline_name, description: baseline name }
      - { name: cohort, description: ALL or a cohort, data_tests: [{ accepted_values: { arguments: { values: [ALL, A,B ] } } }] }
      - { name: candidate, description: candidate evaluated for the cohort (null on ALL) }
      - { name: n, description: rows }
      - { name: mae, description: MAE, data_tests: [not_null] }
      - { name: median_ae, description: median AE }
      - { name: rmse, description: RMSE }
      - { name: within_band1_rate, description: within band 1 }
      - { name: within_band2_rate, description: within band 2 }
      - { name: baseline_n, description: baseline rows }
      - { name: baseline_mae, description: baseline MAE }
      - { name: baseline_within_band1_rate, description: baseline within band 1 }

  - name: slv_eval_folds
    description: Rolling-origin folds per (eval_id, season, period).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [eval_id, season, period]
    columns:
      - { name: eval_id, description: evaluation id }
      - { name: kind, description: evaluation kind }
      - { name: model_version, description: model version }
      - { name: candidate, description: refit candidate }
      - { name: season, description: fold season }
      - { name: period, description: fold period }
      - { name: n, description: fold rows }
      - { name: mae, description: fold MAE }
      - { name: baseline_mae, description: fold baseline MAE }

  - name: slv_rolling_periods
    description: In-season champion vs challenger shadow metrics per (season, period).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [season, period]
    columns:
      - { name: season, description: season }
      - { name: period, description: scored period }
      - { name: period_key, description: season * period_key_base + period }
      - { name: n, description: rows }
      - { name: champion_mae, description: champion MAE }
      - { name: champion_within_band1_rate, description: champion within band 1 }
      - { name: champion_baseline_mae, description: baseline MAE }
      - { name: challenger_mae, description: challenger MAE }
      - { name: challenger_within_band1_rate, description: challenger within band 1 }
      - { name: challenger_baseline_mae, description: baseline MAE }
      - { name: scored_at_utc, description: when scored }

unit_tests:
  - name: target_rules_on_fixed_rows
    description: The target rules macro on fixed rows (0.1 a + 0.5 b + 1.0 c; nulls count as zero).
    model: slv_period_rows
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('brz_period_rows')
        rows:
          - { station_id: e1, station_name: E1, channel: A, day: 2021, day: 3, team: T, stat_a: 10, stat_b: 4, stat_c: 1, utilization: 4.0 }
          - { station_id: e2, station_name: E2, channel: A, day: 2021, day: 3, team: T, stat_a: 20, utilization: 2.0 }
    expect:
      rows:
        - { station_id: e1, target_rules_value: 4.0 }
        - { station_id: e2, target_rules_value: 2.0 }
  - name: predictions_dedup_prefers_periodic_then_latest
    description: The same key in the frozen-test CSV and a periodic file keeps the periodic row.
    model: slv_predictions
    given:
      - input: ref('brz_predictions_test')
        rows:
          - { source_file: t.csv, model_version: m1, candidate: rf, station_id: e1, day: 2023, day: 1, channel: A, station_name: E1, team: T, prediction: 5.0, prediction_floor: 1.0, prediction_ceiling: 9.0, actual: 6.0 }
      - input: ref('brz_predictions_oos')
        rows: []
      - input: ref('brz_predictions_periodic')
        rows:
          - { source_file: p.json, model_version: m1, candidate: rf, station_id: e1, day: 2023, day: 1, channel: A, station_name: E1, team: T, prediction: 7.0, prediction_floor: 2.0, prediction_ceiling: 9.0, actual: 6.0, generated_at_utc: "2024-01-01 00:00:00" }
    expect:
      rows:
        - { station_id: e1, prediction: 7.0, source: periodic, eval_window: "periodic:2023-01" }
