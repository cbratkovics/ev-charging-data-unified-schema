- name: slv_sessions_quarantined
  description: Every rejected bronze row with all of its failing reasons and one primary reason by the fixed precedence,
    so counts by primary_reason sum to the quarantined total (ADR-0009).
  columns:
  - name: source
    description: source short name
    data_tests:
    - not_null
  - name: source_family
    description: file family within the source
  - name: source_file
    description: published file name the row came from
    data_tests:
    - not_null
  - name: station_key
    description: source-prefixed station identifier as conformed
  - name: start_local
    description: parsed local start, if it parsed
  - name: end_local
    description: parsed local end, if it parsed
  - name: energy_kwh
    description: parsed energy, kWh
  - name: charging_minutes
    description: parsed charging minutes
  - name: connected_minutes
    description: computed connected minutes
  - name: implied_kw
    description: implied power used by the ceiling rule
  - name: natural_key_hash
    description: md5 of the null-safe natural key
  - name: primary_reason
    description: the first failing reason by the fixed precedence (ADR-0009)
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - blank_row
          - unparseable_timestamp
          - nonexistent_local_time
          - exact_duplicate
          - natural_key_duplicate
          - end_sentinel_1970
          - end_before_start
          - negative_energy
          - energy_sentinel
          - charging_exceeds_connected
          - implied_kw_over_ceiling
  - name: quarantine_reasons
    description: every failing reason, in precedence order
    data_tests:
    - not_null
  - name: quality_flags
    description: flags the row would have carried had it been accepted
  - name: _row_hash
    description: landing metadata; sha256 over the source columns of the bronze row
    data_tests:
    - not_null
