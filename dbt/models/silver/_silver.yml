version: 2

# Silver = conformed sessions. One model per source keeps every bronze row and marks the
# rejects; slv_sessions_unioned and slv_sessions_quarantined split on primary_reason, so
# bronze = accepted + quarantined is checked per source and per file
# (tests/silver/assert_rows_conserved_per_source_and_file.sql). Generated column blocks are
# repeated per model on purpose: dbt's YAML does not splice lists.

models:
- name: slv_sessions__boulder
  description: Boulder, CO sessions conformed to the unified contract, one row per bronze row, with quarantine reasons
    on the rejects. Wall-clock America/Denver timestamps in two formats parsed and converted to UTC; durations computed
    from UTC and compared with the published Total_Duration; dedup on (station name, start minute, end minute, energy)
    preferring the latest delivery block, then the highest row id, then _row_hash.
  data_tests:
  - dbt_utils.equal_rowcount:
      arguments:
        compare_model: ref('brz_boulder')
  columns:
  - name: source
    description: source short name
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - boulder
          - cary
          - dft_2017
  - name: source_family
    description: 'file family within the source: boulder, cary, or the DfT rapids / rapids_anomalies / fasts / fasts_anomalies'
    data_tests:
    - not_null
  - name: source_session_id
    description: publisher's session id where one is published (DfT ChargingEvent); null otherwise
  - name: source_file
    description: published file name the row came from
    data_tests:
    - not_null
  - name: source_delivery_block
    description: Boulder only; index of the concatenated delivery the row belongs to (0 = oldest)
  - name: station_key
    description: 'source-prefixed station identifier: boulder/<station name>, cary/<station name>, dft_2017/<CPID>,
      or dft_2017/unknown/<Name> when CPID is null'
    data_tests:
    - not_null
  - name: station_name_raw
    description: the publisher's station identifier as landed (a name, or the CPID for DfT)
  - name: site_key
    description: 'site grouping: Boulder address, Cary address, DfT funding body (Name trimmed and inner whitespace collapsed, ADR-0016)'
  - name: site_key_raw
    description: the site grouping exactly as landed (the DfT Name before normalisation); equal to site_key for Boulder and Cary
  - name: port_id
    description: connector id where published (DfT Connector, reduced to its leading integer so the text variants
      of the fasts anomalies file count as the same connector); null otherwise
  - name: port_id_present
    description: true when the row identifies a connector (DfT rows with a Connector id); the capacity grain itself
      lives on dim_station only
    data_tests:
    - not_null
  - name: start_utc
    description: session start as a UTC instant
  - name: end_utc
    description: session end as a UTC instant; null where the source publishes no end (Cary)
  - name: start_local
    description: session start in station-local wall-clock time (naive)
  - name: end_local
    description: session end in station-local wall-clock time; null for Cary
  - name: start_tz
    description: IANA zone of the station
    data_tests:
    - not_null
  - name: is_dst_ambiguous
    description: true when the local start falls in the repeated fall-back hour; resolved to the second occurrence
      (ADR-0009)
    data_tests:
    - not_null
  - name: energy_kwh
    description: energy delivered, kWh
  - name: charging_minutes
    description: minutes actively charging, from the published hh:mm:ss (Cary, Boulder); null for DfT, never imputed
  - name: connected_minutes
    description: minutes plugged in, computed as end_utc minus start_utc (Boulder, DfT); null for Cary, never imputed
  - name: connected_minutes_reported
    description: the publisher's plug-in duration in minutes (Boulder Total_Duration; DfT PluginDuration with its
      per-file unit applied); null for Cary
  - name: duration_disagreement_minutes
    description: connected_minutes minus connected_minutes_reported; the duration_disagrees flag fires above 2 minutes
      (ADR-0005 a)
  - name: idle_minutes
    description: connected minus charging, clamped at zero (a charging time that exceeds the minute-precision connected
      time within tolerance gives 0, not a negative idle); Boulder only
  - name: duration_availability
    description: 'which durations this source publishes: both, charging_only, plug_in_only (ADR-0005 e)'
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - both
          - charging_only
          - plug_in_only
  - name: publisher_excluded_rule
    description: DfT rows meeting the publisher's exclusion rule (zero energy or plug-in of 3 minutes or less),
      reproduced as a flag (ADR-0007); false elsewhere
    data_tests:
    - not_null
  - name: implied_kw
    description: energy over hours of charging (or connected where charging is not published); the implied_kw_over_ceiling
      reason compares it with the source's ceiling
  - name: timestamp_precision_seconds
    description: precision of the published timestamps on this row (1 = seconds, 60 = minutes); the tolerance of
      the charging_exceeds_connected rule (ADR-0009 item 7)
    data_tests:
    - not_null
  - name: natural_key_hash
    description: md5 of the null-safe natural key (ADR-0009); unique among accepted rows
    data_tests:
    - not_null
  - name: quality_flags
    description: 'flags on the row: zero_energy, charging_exceeds_connected_within_precision, over_24h, duration_disagrees,
      dst_ambiguous, publisher_excluded_rule, unknown_station'
  - name: _row_hash
    description: landing metadata; sha256 over the source columns of the bronze row
    data_tests:
    - not_null
  - name: quarantine_reasons
    description: every failing quarantine reason, in precedence order; empty on accepted rows
  - name: primary_reason
    description: the first failing reason by the fixed precedence (ADR-0009); null on accepted rows
