version: 2

# Every source is a parquet file the loaders landed under data/landed/<source>/ (git-ignored;
# the offline fixture under tests/fixtures/landed/ has the same layout). dbt-duckdb reads them in
# place through `external_location`; bronze models copy them into warehouse tables as-is (every
# column a string plus the landing metadata), so silver and gold never touch files.
# `formatter: template` keeps the path a Jinja expression over var('landed_dir').
sources:
  - name: landed
    description: >
      Session files landed by the ev_charging_data_unified_schema loaders: one parquet file per
      downloaded source file, every column a string, plus _source, _file_name, _retrieved_at and
      _row_hash. The manifest at data/landed/manifest.json records URL, bytes, sha256 and row
      count per file.
    loader: ev_charging_data_unified_schema.ingest
    meta:
      owner: "cbratkovics"
    tables:
      - name: palo_alto
        description: Palo Alto, CA charging sessions (operator export, July 2011 to December 2020), landed as strings.
        meta:
          formatter: template
          external_location: "read_parquet('{{ var('landed_dir') }}/palo_alto/*.parquet', union_by_name = true)"
      - name: boulder
        description: Boulder, CO charging sessions (one row per transaction, from 2018), landed as strings.
        meta:
          formatter: template
          external_location: "read_parquet('{{ var('landed_dir') }}/boulder/*.parquet', union_by_name = true)"
      - name: cary
        description: Cary, NC charging sessions at town-owned stations, landed as strings.
        meta:
          formatter: template
          external_location: "read_parquet('{{ var('landed_dir') }}/cary/*.parquet', union_by_name = true)"
      - name: dundee
        description: Dundee, UK charging sessions, one file per year, landed as strings.
        meta:
          formatter: template
          external_location: "read_parquet('{{ var('landed_dir') }}/dundee/*.parquet', union_by_name = true)"
