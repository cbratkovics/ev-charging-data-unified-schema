version: 2

# Gold = the product. Every model has an enforced contract, a description per column and tests.
# The scheduled job exports these tables to artifacts/marts/*.parquet (macro export_gold).
models:
  - name: dim_entity
    description: One row per station with current (latest-seen) attributes; no history.
    config:
      contract: { enforced: true }
    constraints:
      - type: primary_key
        columns: [ station_id ]
    columns:
      - { name: station_id, data_type: varchar, description: entity identifier, constraints: [{ type: not_null }] }
      - { name: station_name, data_type: varchar, description: display name from the newest row }
      - { name: channel, data_type: varchar, description: cohort from the newest row, data_tests: [{ accepted_values: { arguments: { values: [ A,B ] } } }] }
      - { name: team, data_type: varchar, description: team from the newest row }
      - { name: first_season, data_type: integer, description: first season with a row }
      - { name: last_season, data_type: integer, description: season of the newest row }
      - { name: last_period, data_type: integer, description: period of the newest row }
      - { name: rows_played, data_type: integer, description: rows in the warehouse, constraints: [{ type: not_null }] }
      - { name: attribute_source, data_type: varchar, description: rows or predictions, data_tests: [{ accepted_values: { arguments: { values: [rows, predictions] } } }] }

  - name: dim_entity_current
    description: One row per station — the current version of the SCD2 snapshot snp_entity. Not exported.
    config:
      contract: { enforced: true }
    data_tests:
      - dbt_utils.equal_rowcount:
          arguments:
            compare_model: ref('dim_entity')
    columns:
      - { name: station_id, data_type: varchar, description: entity identifier, data_tests: [unique, not_null] }
      - { name: station_name, data_type: varchar, description: current display name }
      - { name: channel, data_type: varchar, description: current cohort }
      - { name: team, data_type: varchar, description: current team }
      - { name: version_from_period_key, data_type: integer, description: data-through period_key when this version was first captured }
      - { name: version_valid_from_utc, data_type: timestamp, description: capture timestamp }

  - name: dim_entity_asof
    description: One row per (station_id, period_key) for every scored period, attributes as of the period from the snapshot history; is_exact_asof false where history cannot answer. Not exported.
    config:
      contract: { enforced: true }
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [ station_id, period_key]
    columns:
      - { name: station_id, data_type: varchar, description: entity identifier, data_tests: [not_null] }
      - { name: period_key, data_type: integer, description: scored period key, data_tests: [not_null] }
      - { name: station_name, data_type: varchar, description: display name as of the period }
      - { name: channel, data_type: varchar, description: cohort as of the period }
      - { name: team, data_type: varchar, description: team as of the period }
      - { name: is_exact_asof, data_type: boolean, description: true when a snapshot version covering the period exists, data_tests: [not_null] }
      - { name: version_from_period_key, data_type: integer, description: capture period_key of the version used }
      - { name: version_valid_from_utc, data_type: timestamp, description: capture timestamp of the version used }

  - name: dim_model_version
    description: One row per trained model version with provenance and the manifest's champion / challenger slots.
    config:
      contract: { enforced: true }
    constraints:
      - type: primary_key
        columns: [model_version]
    columns:
      - { name: model_version, data_type: varchar, description: model version, constraints: [{ type: not_null }] }
      - { name: feature_version, data_type: varchar, description: feature module version }
      - { name: trained_at_utc, data_type: timestamp, description: training time }
      - { name: data_through_season, data_type: integer, description: last season in the training pull }
      - { name: data_through_period, data_type: integer, description: last period in the training pull }
      - { name: train_seasons, data_type: varchar, description: training seasons }
      - { name: val_season, data_type: integer, description: validation season }
      - { name: test_season, data_type: integer, description: frozen test season }
      - { name: target, data_type: varchar, description: target as recorded }
      - { name: input_sha256, data_type: varchar, description: input hash }
      - { name: input_rows, data_type: integer, description: input rows }
      - { name: code_commit, data_type: varchar, description: training commit }
      - { name: sklearn_version, data_type: varchar, description: scikit-learn version }
      - { name: data_library, data_type: varchar, description: source client }
      - { name: interval_method, data_type: varchar, description: interval derivation }
      - { name: is_champion, data_type: boolean, description: manifest champion slot, constraints: [{ type: not_null }] }
      - { name: is_challenger, data_type: boolean, description: manifest challenger slot, constraints: [{ type: not_null }] }

  - name: fct_entity_period
    description: One row per (station, day, day, model_version, candidate) with prediction, interval, realised target, errors and the causal baseline.
    config:
      contract: { enforced: true }
    constraints:
      - type: primary_key
        columns: [ station_id, day, day, model_version, candidate]
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "abs_error is null or abs_error = abs(actual - prediction)"
    columns:
      - { name: station_id, data_type: varchar, description: entity identifier, constraints: [{ type: not_null }] }
      - { name: day, data_type: integer, description: season, constraints: [{ type: not_null }] }
      - { name: day, data_type: integer, description: period, constraints: [{ type: not_null }] }
      - { name: period_key, data_type: integer, description: season * period_key_base + period, constraints: [{ type: not_null }] }
      - { name: model_version, data_type: varchar, description: model version, constraints: [{ type: not_null }], data_tests: [{ relationships: { arguments: { to: ref('dim_model_version'), field: model_version } } }] }
      - { name: candidate, data_type: varchar, description: candidate, constraints: [{ type: not_null }] }
      - { name: channel, data_type: varchar, description: cohort, constraints: [{ type: not_null }] }
      - { name: source, data_type: varchar, description: artifact family, constraints: [{ type: not_null }] }
      - { name: eval_window, data_type: varchar, description: evaluation window, constraints: [{ type: not_null }] }
      - { name: prediction, data_type: double, description: point prediction, constraints: [{ type: not_null }] }
      - { name: prediction_floor, data_type: double, description: floor }
      - { name: prediction_ceiling, data_type: double, description: ceiling }
      - { name: actual, data_type: double, description: realised target (rows, else the artifact's recorded value) }
      - { name: actual_source, data_type: varchar, description: rows or artifact }
      - { name: abs_error, data_type: double, description: "|actual - prediction|" }
      - { name: within_band1, data_type: boolean, description: abs_error <= band 1 }
      - { name: within_band2, data_type: boolean, description: abs_error <= band 2 }
      - { name: interval_hit, data_type: boolean, description: floor <= actual <= ceiling }
      - { name: baseline, data_type: double, description: causal trailing-mean baseline, constraints: [{ type: not_null }] }
      - { name: baseline_abs_error, data_type: double, description: "|actual - baseline|" }
      - { name: baseline_within_band1, data_type: boolean, description: baseline within band 1 }

  - name: fct_period_eval
    description: Per-period evaluation from fct_entity_period; the n-weighted aggregate over a window reconciles to the committed artifact (tests/gold/assert_marts_reconcile_to_eval_artifacts.sql).
    config:
      contract: { enforced: true }
    constraints:
      - type: primary_key
        columns: [eval_window, day, day, model_version, candidate, cohort]
    columns:
      - { name: eval_window, data_type: varchar, description: evaluation window, constraints: [{ type: not_null }] }
      - { name: day, data_type: integer, description: season, constraints: [{ type: not_null }] }
      - { name: day, data_type: integer, description: period, constraints: [{ type: not_null }] }
      - { name: period_key, data_type: integer, description: season * period_key_base + period, constraints: [{ type: not_null }] }
      - { name: model_version, data_type: varchar, description: model version, constraints: [{ type: not_null }] }
      - { name: candidate, data_type: varchar, description: candidate, constraints: [{ type: not_null }] }
      - { name: cohort, data_type: varchar, description: ALL or a cohort, constraints: [{ type: not_null }], data_tests: [{ accepted_values: { arguments: { values: [ALL, A,B ] } } }] }
      - { name: n, data_type: integer, description: rows with an actual, constraints: [{ type: not_null }] }
      - { name: mae, data_type: double, description: MAE, constraints: [{ type: not_null }] }
      - { name: median_ae, data_type: double, description: median AE }
      - { name: rmse, data_type: double, description: RMSE }
      - { name: within_band1_rate, data_type: double, description: share within band 1, data_tests: [{ dbt_expectations.expect_column_values_to_be_between: { arguments: { min_value: 0, max_value: 1 } } }] }
      - { name: within_band2_rate, data_type: double, description: share within band 2 }
      - { name: interval_coverage, data_type: double, description: share inside floor..ceiling }
      - { name: baseline_mae, data_type: double, description: baseline MAE }
      - { name: baseline_within_band1_rate, data_type: double, description: baseline share within band 1 }
      - { name: mae_minus_baseline, data_type: double, description: negative when the model beats the baseline }

  - name: fct_decision_policy
    description: >
      Floor-policy metrics per (day, day, channel, model_version,
      candidate, min_floor) swept over var min_floor_grid. Versioned: v1 is the served shape and
      keeps the relation name fct_decision_policy (alias); v2 (latest) adds
      recommendation_within_band1_rate (reconciled to the artifacts at min_floor = 0) and
      recommendation_interval_coverage. Deprecation policy: a version is served for at least one
      season after its successor ships; the API pins the version it reads.
    latest_version: 2
    config:
      contract: { enforced: true }
    constraints:
      - type: primary_key
        columns: [ day, day, channel, model_version, candidate, min_floor]
    versions:
      - v: 1
        config:
          alias: fct_decision_policy
        columns:
          - include: all
            exclude: [recommendation_within_band1_rate, recommendation_interval_coverage]
      - v: 2
        columns:
          - include: all
    columns:
      - { name: day, data_type: integer, description: season, constraints: [{ type: not_null }] }
      - { name: day, data_type: integer, description: period, constraints: [{ type: not_null }] }
      - { name: period_key, data_type: integer, description: season * period_key_base + period, constraints: [{ type: not_null }] }
      - { name: channel, data_type: varchar, description: cohort, constraints: [{ type: not_null }] }
      - { name: model_version, data_type: varchar, description: model version, constraints: [{ type: not_null }] }
      - { name: candidate, data_type: varchar, description: candidate, constraints: [{ type: not_null }] }
      - { name: min_floor, data_type: double, description: floor threshold of this row, constraints: [{ type: not_null }] }
      - { name: eligible_decisions, data_type: integer, description: scored entities, constraints: [{ type: not_null }] }
      - { name: recommendations, data_type: integer, description: floor cleared min_floor, constraints: [{ type: not_null }] }
      - { name: reviews, data_type: integer, description: below the threshold, constraints: [{ type: not_null }] }
      - { name: recommendation_rate, data_type: double, description: recommendations / eligible }
      - { name: recommendations_with_outcome, data_type: integer, description: recommended with a realised actual, constraints: [{ type: not_null }] }
      - { name: recommendation_mae, data_type: double, description: MAE over recommended with outcomes }
      - { name: review_mae, data_type: double, description: MAE over review with outcomes }
      - { name: mean_regret, data_type: double, description: mean(best eligible - actual) over recommended }
      - { name: hit_rate, data_type: double, description: share of recommended beating replacement level, data_tests: [{ dbt_expectations.expect_column_values_to_be_between: { arguments: { min_value: 0, max_value: 1 } } }] }
      - { name: downside_rate, data_type: double, description: share of recommended below their floor, data_tests: [{ dbt_expectations.expect_column_values_to_be_between: { arguments: { min_value: 0, max_value: 1 } } }] }
      - { name: recommendation_within_band1_rate, data_type: double, description: "v2: share of recommended with an outcome inside band 1; reconciles to the artifacts at min_floor = 0", data_tests: [{ dbt_expectations.expect_column_values_to_be_between: { arguments: { min_value: 0, max_value: 1 } } }] }
      - { name: recommendation_interval_coverage, data_type: double, description: "v2: share of recommended with an outcome inside floor..ceiling" }

unit_tests:
  - name: period_eval_mae_and_within_band
    description: MAE and within-band on fixed rows (abs errors 1, 3, 4.5, 6 with bands 3 and 5 → mae 3.625, within_band1 = 2/4, within_band2 = 3/4); a row without an actual is excluded.
    model: fct_period_eval
    given:
      - input: ref('fct_entity_period')
        rows:
          - { eval_window: "frozen_test:2023", day: 2023, day: 1, period_key: 202301, model_version: m1, candidate: rf, channel: A, source: frozen_test, prediction: 10.0, actual: 11.0, abs_error: 1.0, within_band1: true, within_band2: true, interval_hit: true, baseline: 9.0, baseline_abs_error: 2.0, baseline_within_band1: true }
          - { eval_window: "frozen_test:2023", day: 2023, day: 1, period_key: 202301, model_version: m1, candidate: rf, channel: A, source: frozen_test, prediction: 10.0, actual: 13.0, abs_error: 3.0, within_band1: true, within_band2: true, interval_hit: false, baseline: 11.0, baseline_abs_error: 2.0, baseline_within_band1: true }
          - { eval_window: "frozen_test:2023", day: 2023, day: 1, period_key: 202301, model_version: m1, candidate: rf, channel: A, source: frozen_test, prediction: 10.0, actual: 14.5, abs_error: 4.5, within_band1: false, within_band2: true, interval_hit: true, baseline: 12.5, baseline_abs_error: 2.0, baseline_within_band1: true }
          - { eval_window: "frozen_test:2023", day: 2023, day: 1, period_key: 202301, model_version: m1, candidate: rf, channel: A, source: frozen_test, prediction: 10.0, actual: 16.0, abs_error: 6.0, within_band1: false, within_band2: false, interval_hit: false, baseline: 14.0, baseline_abs_error: 2.0, baseline_within_band1: true }
          - { eval_window: "frozen_test:2023", day: 2023, day: 1, period_key: 202301, model_version: m1, candidate: rf, channel: A, source: frozen_test, prediction: 10.0, actual: null, abs_error: null, within_band1: null, within_band2: null, interval_hit: null, baseline: 10.0, baseline_abs_error: null, baseline_within_band1: null }
    expect:
      rows:
        - { cohort: ALL, n: 4, mae: 3.625, within_band1_rate: 0.5, within_band2_rate: 0.75, interval_coverage: 0.5, baseline_mae: 2.0, baseline_within_band1_rate: 1.0, mae_minus_baseline: 1.625 }
        - { cohort: A, n: 4, mae: 3.625, within_band1_rate: 0.5, within_band2_rate: 0.75, interval_coverage: 0.5, baseline_mae: 2.0, baseline_within_band1_rate: 1.0, mae_minus_baseline: 1.625 }
