name: scheduled

# Autonomous scoring job: pull source → contracts (dbt silver tests on MotherDuck) → drift → score
# champion → shadow-evaluate challenger → publish / hold / promote → dbt build on MotherDuck →
# export gold marts → commit artifacts (incl. artifacts/marts) → mirror the Space.
#
# MOTHERDUCK_TOKEN is a repository secret used only here (one prod build per run, well inside the
# free tier's 10 compute-hours/month). The Space never receives it.
#
# GitHub disables scheduled workflows after 60 days without repository activity. The commit this
# job makes on every PUBLISH/PROMOTE run is what keeps the schedule alive. The cron is mirrored
# from ev_charging_data_unified_schema/config.py (PROJECT.schedule_cron); tests/test_project_config.py checks it.

on:
  schedule:
    - cron: "0 10 * * 2"
  workflow_dispatch:
    inputs:
      season:
        description: "Season (leave blank to detect from the loader's calendar)"
        required: false
      period:
        description: "Period to score (leave blank to detect)"
        required: false
      dry_run:
        description: "Compute but do not commit"
        type: boolean
        default: false
      full_refresh:
        description: "Rebuild the incremental silver rows table from scratch"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: scheduled
  cancel-in-progress: false

env:
  PKG: ev_charging_data_unified_schema

jobs:
  scheduled:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-train.txt
            constraints.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -r requirements-train.txt
          pip install -e .
      - name: dbt deps
        run: dbt deps --project-dir dbt --profiles-dir dbt
      - name: Run the scheduled job
        id: run
        continue-on-error: true
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
          EV_CHARGING_DATA_UNIFIED_SCHEMA_DBT_TARGET: prod
          EV_CHARGING_DATA_UNIFIED_SCHEMA_DBT_FULL_REFRESH: ${{ inputs.full_refresh == true && '1' || '' }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.season }}" ] && [ -n "${{ inputs.period }}" ]; then
            ARGS="--season ${{ inputs.season }} --period ${{ inputs.period }}"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          set +e
          python scripts/run_scheduled.py $ARGS | tee scheduled.log
          echo "exit=$?" >> "$GITHUB_OUTPUT"
      - name: Read run outcome
        id: outcome
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, glob
          from ev_charging_data_unified_schema.config import PROJECT
          runs = sorted(glob.glob("artifacts/runs/run-*.json"))
          if runs:
              log = json.load(open(runs[-1]))
              print(f"action={log['action']}")
              print(f"season={log['season']}")
              print(f"period={log['period']:0{PROJECT.period_width}d}")
              print(f"run_id={log['run_id']}")
          else:
              print("action=DRY_RUN"); print("season=0"); print("period=00"); print("run_id=none")
          PY
      - name: Build the warehouse on MotherDuck and export the gold marts
        id: dbt
        if: ${{ inputs.dry_run != true && (steps.outcome.outputs.action == 'PUBLISH' || steps.outcome.outputs.action == 'PROMOTE') }}
        env:
          MOTHERDUCK_TOKEN: ${{ secrets.MOTHERDUCK_TOKEN }}
        run: |
          VARS="{\"target_season\": ${{ steps.outcome.outputs.season }}, \"target_period\": $((10#${{ steps.outcome.outputs.period }}))}"
          FLAGS=""
          if [ "${{ inputs.full_refresh }}" = "true" ]; then FLAGS="--full-refresh"; fi
          dbt build --project-dir dbt --profiles-dir dbt --target prod --vars "$VARS" $FLAGS
          mkdir -p artifacts/marts
          dbt run-operation export_gold --project-dir dbt --profiles-dir dbt --target prod
      - name: Commit artifacts
        if: ${{ inputs.dry_run != true && steps.outcome.outputs.action != 'DRY_RUN' }}
        run: |
          git config user.name "scheduled-job"
          git config user.email "scheduled-job@users.noreply.github.com"
          git add artifacts docs/MODEL_CARD.md
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "scheduled: ${{ steps.outcome.outputs.season }} p${{ steps.outcome.outputs.period }} ${{ steps.outcome.outputs.action }}"
          git push
      - name: Mirror artifacts to the Hugging Face Space
        if: ${{ inputs.dry_run != true && (steps.outcome.outputs.action == 'PUBLISH' || steps.outcome.outputs.action == 'PROMOTE') }}
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -q "huggingface_hub[cli]"
          hf upload "$(python -m ev_charging_data_unified_schema.config hf_space)" . . --repo-type space \
            --exclude ".git/*" --exclude ".venv/*" --exclude "data/*" --exclude "*.egg-info/*" \
            --exclude ".duckdb/*" --exclude ".dbt-state/*" --exclude "dbt/target/*" --exclude "dbt/dbt_packages/*" \
            --exclude ".pytest_cache/*" --exclude ".ruff_cache/*" --exclude "*.env*" \
            --exclude "frontend/node_modules/*" --exclude "frontend/.next/*"
      - name: Ensure the notification label exists
        # Idempotent (--force updates an existing label); the HOLD / failure issues below must
        # never depend on repository setup.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create scheduled-hold --color D93F0B \
            --description "Opened by scheduled.yml when a run HOLDs or the warehouse build fails" --force || true
      - name: Open an issue if the warehouse build failed
        if: ${{ failure() && steps.dbt.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "scheduled: warehouse build failed for ${{ steps.outcome.outputs.season }} p${{ steps.outcome.outputs.period }} (${{ steps.outcome.outputs.run_id }})" \
            --label "scheduled-hold" \
            --body "dbt build --target prod (or export_gold) failed after scoring; nothing was committed. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Open an issue on HOLD
        if: ${{ steps.outcome.outputs.action == 'HOLD' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "scheduled HOLD: ${{ steps.outcome.outputs.season }} p${{ steps.outcome.outputs.period }} (${{ steps.outcome.outputs.run_id }})" \
            --label "scheduled-hold" --body-file scheduled.log
      - name: Fail the job on HOLD so it is visible
        if: ${{ steps.outcome.outputs.action == 'HOLD' }}
        run: exit 1
