name: ci

# Offline CI on every push and pull request: lint, the pytest suite on the committed fixture,
# and a dbt parse. No network, no secrets, no paid service. The full build over the real sources
# lives in full-build.yml (Phase 7) and the dbt build / slim CI / Pages steps return there.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PKG: ev_charging_data_unified_schema

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install (from pyproject, pinned by constraints.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev]"
      - name: Cache dbt packages
        uses: actions/cache@v5
        with:
          path: dbt/dbt_packages
          key: dbt-packages-${{ hashFiles('dbt/packages.yml', 'dbt/package-lock.yml') }}
      - name: Lint
        run: |
          ruff check $PKG tests scripts
          black --check $PKG tests scripts
      - name: Tests (offline, fixture only)
        run: python -m pytest tests
      - name: Rendered profile docs match the committed artifact
        run: python scripts/render_profile.py --check
      - name: dbt parse
        run: make dbt-parse DBT=dbt
      - name: dbt build on the fixture (offline)
        run: make dbt-fixture DBT=dbt PY=python
      - name: dbt docs generate + every model, column and source described
        run: |
          EV_CHARGING_DATA_UNIFIED_SCHEMA_DUCKDB_PATH=.duckdb/fixture.duckdb dbt docs generate --project-dir dbt --profiles-dir dbt --target dev --vars '{landed_dir: tests/fixtures/landed}' --static
          python scripts/check_dbt_descriptions.py
      - name: sqlfluff
        run: sqlfluff lint dbt/models dbt/tests dbt/macros dbt/snapshots
