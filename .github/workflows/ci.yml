name: ci

# Offline CI on every push and pull request: lint, the pytest suite on the committed fixture,
# and a complete fixture build. No secrets or paid service. The full build over the real sources
# lives in full-build.yml; CI always materializes the small fixture warehouse from scratch because
# a production state manifest is comparison metadata, not a warehouse that local docs can query.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PKG: ev_charging_data_unified_schema

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install (from pyproject, pinned by constraints.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev]"
      - name: Cache dbt packages
        uses: actions/cache@v5
        with:
          path: dbt/dbt_packages
          key: dbt-packages-${{ hashFiles('dbt/packages.yml', 'dbt/package-lock.yml') }}
      - name: Lint
        run: |
          ruff check $PKG tests scripts
          black --check $PKG tests scripts
      - name: Rendered profile docs match the committed artifact
        run: python scripts/render_profile.py --check
      - name: Contract docs match the contract definitions
        run: python scripts/render_contracts.py --check
      - name: Every measured number in the docs resolves to an artifact key; rendered blocks are current
        run: make check-numbers PY=python
      - name: dbt parse
        run: make dbt-parse DBT=dbt
      - name: Build complete fixture warehouse
        env:
          EV_CHARGING_DATA_UNIFIED_SCHEMA_DUCKDB_PATH: .duckdb/fixture.duckdb
          EV_CHARGING_DATA_UNIFIED_SCHEMA_DUCKDB_THREADS: "1"
        run: |
          make dbt-deps DBT=dbt
          make fixture-landed PY=python
          mkdir -p .duckdb
          dbt build --project-dir dbt --profiles-dir dbt --target dev --full-refresh
      - name: Tests (offline; the fixture warehouse is built above; includes the exports contract)
        run: python -m pytest tests -ra
      - name: dbt docs generate + every model, column and source described
        env:
          EV_CHARGING_DATA_UNIFIED_SCHEMA_DUCKDB_PATH: .duckdb/fixture.duckdb
          EV_CHARGING_DATA_UNIFIED_SCHEMA_DUCKDB_THREADS: "1"
        run: |
          dbt docs generate --project-dir dbt --profiles-dir dbt --target dev --static
          python scripts/check_dbt_descriptions.py
      - name: sqlfluff
        run: sqlfluff lint dbt/models dbt/tests dbt/macros dbt/snapshots
