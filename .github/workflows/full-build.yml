name: full-build

# The scheduled full build over the real sources (ADR-0015). It never commits: it refreshes the
# sources with conditional requests, builds the warehouse, regenerates every artifact into a
# scratch directory, compares them with the committed latest ones, uploads everything as
# workflow artifacts, publishes the dbt docs (with manifest.json for slim CI) to GitHub Pages,
# and opens an issue when upstream data changed (informational) or when the outputs moved with
# identical inputs or reconciliation is blocking (regression). Releases are owner-run
# (`make release`, then commit).

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 * *"  # monthly, the 1st at 06:00 UTC

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

concurrency:
  group: full-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PKG: ev_charging_data_unified_schema
      EV_CHARGING_DATA_UNIFIED_SCHEMA_DUCKDB_THREADS: "1"
    outputs:
      status: ${{ steps.compare.outputs.status }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -c constraints.txt -e ".[dev]"
      - name: Cache dbt packages
        uses: actions/cache@v5
        with:
          path: dbt/dbt_packages
          key: dbt-packages-${{ hashFiles('dbt/packages.yml', 'dbt/package-lock.yml') }}
      - name: Source cache key (from the committed latest silver artifact)
        id: key
        run: echo "key=$(python scripts/source_cache_key.py)" >> "$GITHUB_OUTPUT"
      - name: Restore the downloaded sources
        uses: actions/cache@v5
        with:
          path: |
            data/raw
            data/landed
          key: ${{ steps.key.outputs.key }}
          restore-keys: sources-
      - name: Refresh the sources with conditional requests and land them
        run: python -m $PKG.ingest --refresh
      - name: dbt build (real data, one DuckDB thread)
        run: make dbt-deps DBT=dbt && mkdir -p .duckdb && dbt build --project-dir dbt --profiles-dir dbt --target dev --full-refresh
      - name: Regenerate the artifacts into a scratch directory
        run: |
          mkdir -p fresh
          python scripts/silver_summary.py --out fresh/silver || echo "silver summary exited non-zero (blocking reconciliation is reported below)"
          python scripts/sensitivity.py --out fresh/sensitivity
          python scripts/profile_sources.py --out fresh/profile
      - name: Compare with the committed latest artifacts
        id: compare
        run: |
          set +e
          python scripts/compare_artifacts.py --fresh-dir fresh --report fresh/compare.json --issue-body fresh/issue.md
          code=$?
          set -e
          case $code in
            0) echo "status=ok" >> "$GITHUB_OUTPUT" ;;
            2) echo "status=upstream_changed" >> "$GITHUB_OUTPUT" ;;
            3) echo "status=regression" >> "$GITHUB_OUTPUT" ;;
            *) exit $code ;;
          esac
      - name: dbt docs (static site plus manifest.json as the production state)
        run: |
          dbt docs generate --project-dir dbt --profiles-dir dbt --target dev --static
          mkdir -p site && cp dbt/target/static_index.html site/index.html && cp dbt/target/manifest.json site/manifest.json
      - name: Upload the fresh artifacts and the exports
        uses: actions/upload-artifact@v4
        with:
          name: full-build-${{ github.run_id }}
          path: |
            fresh
            artifacts/drift
      - name: Upload the docs site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - name: Open an issue (label created first so the step never depends on repository setup)
        if: ${{ steps.compare.outputs.status != 'ok' }}
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.compare.outputs.status }}
        run: |
          label=$([ "$STATUS" = "regression" ] && echo "full-build-regression" || echo "new-source-data")
          gh label create "$label" --force --color "$([ "$STATUS" = "regression" ] && echo B60205 || echo 0E8A16)" --description "opened by full-build.yml" || true
          title=$(python -c "import json; print(json.load(open('fresh/compare.json'))['issue_title'])")
          gh issue create --title "$title ($(date -u +%Y-%m-%d))" --label "$label" --body-file fresh/issue.md
      - name: Fail the run on a regression
        if: ${{ steps.compare.outputs.status == 'regression' }}
        run: exit 1

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
